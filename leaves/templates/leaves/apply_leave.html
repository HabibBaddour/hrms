{% extends 'base.html' %}

{% block title %}تقديم طلب إجازة | HRMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="glass-card p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="stat-icon bg-primary bg-opacity-10 text-primary">
                    <i class="fa-solid fa-calendar-plus"></i>
                </div>
                <div>
                    <h4 class="fw-bold mb-0">تقديم طلب إجازة جديد</h4>
                    <p class="text-muted small mb-0">سيتم تحليل الطلب بواسطة النموذج الذكي وتوجيهه للإدارة</p>
                </div>
            </div>

            <form action="{% url 'leaves:apply_leave' %}" method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">نوع الإجازة</label>
                    <select name="leave_type" class="form-select" required>
                        <option value="ANNUAL">إجازة سنوية</option>
                        <option value="SICK">إجازة مرضية</option>
                        <option value="UNPAID">إجازة بدون راتب</option>
                        <option value="EMERGENCY">إجازة طارئة</option>
                    </select>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">تاريخ البداية</label>
                        <input type="date" name="start_date" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">تاريخ النهاية</label>
                        <input type="date" name="end_date" class="form-control" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">سبب الإجازة</label>
                    <textarea name="reason" class="form-control" rows="3" placeholder="أدخل أسباب طلب الإجازة..." required></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-custom-primary flex-grow-1">إرسال الطلب</button>
                    <a href="{% url 'leaves:leave_list' %}" class="btn btn-outline-secondary">إلغاء</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
