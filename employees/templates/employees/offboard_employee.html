{% extends 'base.html' %}
{% block title %}إنهاء خدمة الموظف | HRMS{% endblock %}
{% block content %}<div class="container py-4"><div class="row justify-content-center"><div class="col-lg-7"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h3 class="fw-bold text-danger mb-2">إجراء إنهاء الخدمة</h3><p class="text-muted">سيتم تعطيل حساب {{ employee.get_full_name }} بعد حفظ هذا الإجراء.</p><form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label">نوع الإجراء</label><select name="status" class="form-select"><option value="TERMINATED">إنهاء خدمة</option><option value="RESIGNED">استقالة</option></select></div><div class="mb-3"><label class="form-label">التاريخ</label><input type="date" name="termination_date" class="form-control" required></div><div class="mb-3"><label class="form-label">السبب والتفاصيل</label><textarea name="termination_reason" class="form-control" rows="4" required></textarea></div><div class="mb-4"><label class="form-label">حالة الإخلاء</label><select name="clearance_status" class="form-select"><option value="PENDING">قيد الإخلاء</option><option value="IN_PROGRESS">قيد التنفيذ</option><option value="CLEARED">مكتمل</option></select></div><button class="btn btn-danger">تأكيد إنهاء الخدمة</button> <a href="{% url 'employees:contract_detail' employee.pk %}" class="btn btn-outline-secondary">إلغاء</a></form></div></div></div></div></div>{% endblock %}
