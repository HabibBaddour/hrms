{% extends 'base.html' %}

{% block title %}إضافة مسمى وظيفي | HRMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="glass-card p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="stat-icon bg-primary bg-opacity-10 text-primary">
                    <i class="fa-solid fa-briefcase"></i>
                </div>
                <div>
                    <h4 class="fw-bold mb-0">إضافة مسمى وظيفي جديد</h4>
                    <p class="text-muted small mb-0">ربط المسمى الوظيفي بالقسم التابع له</p>
                </div>
            </div>

            <form action="{% url 'departments:add_position' %}" method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">اسم الوظيفة / المسمى الوظيفي</label>
                    <input type="text" name="title" class="form-control" placeholder="مثال: مهندس ذكاء اصطناعي" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">القسم التابع له</label>
                    <select name="department" class="form-select" required>
                        <option value="" disabled selected>اختر القسم...</option>
                        {% for dept in departments %}
                            <option value="{{ dept.id }}">{{ dept.name }} ({{ dept.code }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">الدور والصلاحية الممنوحة (Role/Permission)</label>
                    <select name="group" class="form-select">
                        <option value="" selected>بدون دور محدد</option>
                        {% for group in groups %}
                            <option value="{{ group.id }}">دور: {{ group.name }}</option>
                        {% endfor %}
                    </select>
                    <div class="form-text text-muted small">
                        * يتحدد بناءً على هذا الدور مستوى صلاحيات الوصول للموظف المعين بهذه الوظيفة.
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-custom-primary flex-grow-1">حفظ الوظيفة</button>
                    <a href="{% url 'departments:department_list' %}" class="btn btn-outline-secondary">إلغاء</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
