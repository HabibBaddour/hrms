{% extends 'base.html' %}

{% block title %}تعديل قسم {{ department.name }} | HRMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="glass-card p-4">
            <h4 class="fw-bold mb-3 text-dark">تعديل بيانات القسم</h4>
            <hr class="mb-4">

            <form action="{% url 'departments:edit_department' department.id %}" method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">اسم القسم</label>
                    <input type="text" name="name" class="form-control" value="{{ department.name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">رمز القسم (Code)</label>
                    <input type="text" name="code" class="form-control" value="{{ department.code }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">وصف القسم</label>
                    <textarea name="description" class="form-control" rows="4" placeholder="اكتب وصفاً للقسم ومهامه الأساسية...">{{ department.description|default:"" }}</textarea>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{% url 'departments:department_detail' department.id %}" class="btn btn-light border fw-semibold">إلغاء</a>
                    <button type="submit" class="btn btn-custom-primary">حفظ التغييرات</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
