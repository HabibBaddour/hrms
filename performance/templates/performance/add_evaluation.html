{% extends 'base.html' %}

{% block title %}إضافة تقييم الأداء | HRMS{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="fw-bold mb-3">إضافة تقييم أداء جديد</h3>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">الموظف</label>
                            <select name="employee" class="form-select" required>
                                <option value="">اختر الموظف</option>
                                {% for employee in employees %}
                                    <option value="{{ employee.id }}">{{ employee.get_full_name|default:employee.user.username }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">الفترة</label>
                            <input type="text" name="period" class="form-control" value="Q1 2026" required>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">جودة العمل</label>
                                <input type="number" min="1" max="5" name="work_quality" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">الالتزام</label>
                                <input type="number" min="1" max="5" name="commitment" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">التعاون</label>
                                <input type="number" min="1" max="5" name="cooperation" class="form-control" required>
                            </div>
                        </div>
                        <div class="mt-3">
                            <label class="form-label">ملاحظات المدير</label>
                            <textarea name="feedback" class="form-control" rows="4" required></textarea>
                        </div>
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">حفظ التقييم</button>
                            <a href="{% url 'performance_dashboard' %}" class="btn btn-outline-secondary">إلغاء</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
